version: '3.8'

# ─── Location Independent Voting System ────────────────────────────────────
# Run with: docker-compose up -d
#
# Services:
#   backend      — Node.js API server
#   frontend     — React voting terminal + dashboard

services:

  # ── Node.js Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voting-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production}
      VOTE_ENCRYPTION_KEY: ${VOTE_ENCRYPTION_KEY:-12345678901234567890123456789012}
      FRONTEND_URL: http://localhost:3000
      MYSQL_HOST: ${MYSQL_HOST:-localhost}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Mysql@9876}
      MYSQL_DB: ${MYSQL_DB:-voting_db}
    volumes:
      - ./backend/db:/app/db
      - ./backend/blockchain:/app/blockchain
    networks:
      - voting-net

  # ── React Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voting-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - voting-net

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  voting-net:
    driver: bridge
